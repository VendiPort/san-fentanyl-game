<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>SAN FENTANYL</title>
<style>:root{--b:clamp(38px,min(10vw,13vh),60px);--g:6px}
html,body{margin:0;background:#05020c;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas{display:block;width:min(100vw,177.7vh);height:auto;aspect-ratio:16/9;touch-action:none;position:absolute;left:0;right:0;top:0;bottom:0;margin:auto;max-height:100vh}
#tc{position:fixed;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom));padding:0 max(8px,env(safe-area-inset-left));display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;box-sizing:border-box;z-index:5}
#pad,#act{display:grid;gap:var(--g);pointer-events:none}
#pad{grid-template-columns:repeat(3,var(--b));grid-template-rows:repeat(3,var(--b))}
#act{grid-template-columns:repeat(3,var(--b));grid-auto-rows:var(--b)}
#tc button{pointer-events:auto;width:var(--b);height:var(--b);padding:0;border-radius:50%;border:2px solid #0ff;background:rgba(10,0,30,.5);color:#0ff;font:bold calc(var(--b)*.32) monospace;touch-action:none;box-shadow:0 0 8px #0ff6}
#tc button.pw{grid-column:2/4;width:auto;border-radius:calc(var(--b)/2);border-color:#ff2bd6;color:#ff2bd6;background:rgba(60,0,50,.6);box-shadow:0 0 12px #ff2bd6aa}
@media (orientation:portrait){:root{--b:min(15vw,72px)}canvas{top:0;bottom:auto;margin:0 auto}}
</style></head><body><canvas id="c" width="960" height="540"></canvas><div id="tc"></div>
<script src="game.js?v=2"></script></body></html>
